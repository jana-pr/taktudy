<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006D77" />
      <stop offset="100%" stop-color="#004348" />
    </linearGradient>

    <!-- Dial Gradient -->
    <radialGradient id="dialGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#002F33" />
      <stop offset="100%" stop-color="#001F22" />
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4A261" />
      <stop offset="50%" stop-color="#E9C46A" />
      <stop offset="100%" stop-color="#E76F51" />
    </linearGradient>

    <!-- Needle North Shading -->
    <linearGradient id="needleNorthLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F28482" />
      <stop offset="100%" stop-color="#E76F51" />
    </linearGradient>
    <linearGradient id="needleNorthDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E76F51" />
      <stop offset="100%" stop-color="#D05336" />
    </linearGradient>

    <!-- Needle South Shading -->
    <linearGradient id="needleSouthLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="needleSouthDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="needleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Icon Base: Rounded Tile -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bgGrad)" />

  <!-- Outer Dial Golden Ring -->
  <circle cx="256" cy="256" r="185" fill="url(#dialGrad)" stroke="url(#ringGrad)" stroke-width="22" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.3))" />

  <!-- Inner Compass Track -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Cardinal Tick Marks (N, E, S, W) -->
  <!-- North -->
  <line x1="256" y1="85" x2="256" y2="112" stroke="#FAF0CA" stroke-width="7" stroke-linecap="round" />
  <!-- South -->
  <line x1="256" y1="400" x2="256" y2="427" stroke="#FAF0CA" stroke-width="7" stroke-linecap="round" />
  <!-- West -->
  <line x1="85" y1="256" x2="112" y2="256" stroke="#FAF0CA" stroke-width="7" stroke-linecap="round" />
  <!-- East -->
  <line x1="400" y1="256" x2="427" y2="256" stroke="#FAF0CA" stroke-width="7" stroke-linecap="round" />

  <!-- Sub-cardinal minor ticks -->
  <line x1="140" y1="140" x2="156" y2="156" stroke="rgba(250,240,202,0.4)" stroke-width="4" stroke-linecap="round" />
  <line x1="372" y1="140" x2="356" y2="156" stroke="rgba(250,240,202,0.4)" stroke-width="4" stroke-linecap="round" />
  <line x1="140" y1="372" x2="156" y2="356" stroke="rgba(250,240,202,0.4)" stroke-width="4" stroke-linecap="round" />
  <line x1="372" y1="372" x2="356" y2="356" stroke="rgba(250,240,202,0.4)" stroke-width="4" stroke-linecap="round" />

  <!-- Compass Needle Group: pointing North-East (45 degrees) -->
  <g transform="rotate(45 256 256)" filter="url(#needleShadow)">
    <!-- North Pointer Left (lighter) -->
    <polygon points="256,70 216,256 256,256" fill="url(#needleNorthLight)" />
    <!-- North Pointer Right (darker) -->
    <polygon points="256,70 256,256 296,256" fill="url(#needleNorthDark)" />

    <!-- South Pointer Left (lighter) -->
    <polygon points="256,442 216,256 256,256" fill="url(#needleSouthLight)" />
    <!-- South Pointer Right (darker) -->
    <polygon points="256,442 256,256 296,256" fill="url(#needleSouthDark)" />
  </g>

  <!-- Center Pivot Ring & Jewel -->
  <circle cx="256" cy="256" r="34" fill="#001F22" stroke="url(#ringGrad)" stroke-width="4" />
  <circle cx="256" cy="256" r="22" fill="#F59E0B" />
  <circle cx="256" cy="256" r="10" fill="#FFFFFF" />
</svg>
